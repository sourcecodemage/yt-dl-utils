name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: release_version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "VERSION ($version) must match pushed tag ($GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -v ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=(
            'linux amd64'
            'linux arm64'
            'darwin amd64'
            'darwin arm64'
            'windows amd64'
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            extension=''
            if [[ "$goos" == 'windows' ]]; then
              extension='.exe'
            fi

            output="dist/yt-dlp-utils-${goos}-${goarch}${extension}"
            echo "Building ${output}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -v -trimpath -ldflags='-s -w' -o "$output" .
          done

          cd dist
          sha256sum yt-dlp-utils-* > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.value }}
          generate_release_notes: true
          files: dist/*